                              self.add("TCP ERROR: \(e.localizedDescription)")
                          case .cancelled:
                              self.status = "ÐÑÐºÐ»ÑÑÐµÐ½Ð¾"
                          default:
                              break
                          }
                      }
                  }

                  c.start(queue: DispatchQueue(label: "elm327.tcp"))
              }

              func disconnect() {
                  timeoutWork?.cancel()
                  timeoutWork = nil
                  if let w = wait {
                      wait = nil
                      w.resume(throwing: E.disconnected)
                  }
                  connection?.cancel()
                  connection = nil
                  rx.removeAll()
                  status = "ÐÑÐºÐ»ÑÑÐµÐ½Ð¾"
              }

              private func receive() {
                  guard let connection else { return }

                  connection.receive(minimumIncompleteLength: 1, maximumLength: 8192) {
                      [weak self] data, _, complete, error in

                      Task { @MainActor in
                          guard let self else { return }

                          if let data {
                              self.rx.append(data)
                              if let t = String(data: self.rx, encoding: .ascii), t.contains(">") {
                                  self.rx.removeAll()
                                  let clean = t
                                      .replacingOccurrences(of: ">", with: "")
                                      .replacingOccurrences(of: "\r", with: "\n")
                                      .trimmingCharacters(in: .whitespacesAndNewlines)

                                  if let w = self.wait {
                                      self.timeoutWork?.cancel()
                                      self.timeoutWork = nil
                                      self.wait = nil
                                      w.resume(returning: clean)
                                  }
                              }
                          }

                          if complete || error != nil {
                              if let w = self.wait {
                                  self.timeoutWork?.cancel()
                                  self.timeoutWork = nil
                                  self.wait = nil
                                  w.resume(throwing: E.disconnected)
                              }
                              self.status = "Ð¡Ð¾ÐµÐ´Ð¸Ð½ÐµÐ½Ð¸Ðµ Ð¿Ð¾ÑÐµÑÑÐ½Ð¾"
                          } else {
                              self.receive()
                          }
                      }
                  }
              }

              func send(_ command: String, timeout: Double = 5) async throws -> String {
                  guard let connection else { throw E.notConnected }

                  while wait != nil {
                      try await Task.sleep(nanoseconds: 50_000_000)
                  }

                  let cmd = command.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                  add("â \(cmd)")
                  rx.removeAll()

                  return try await withCheckedThrowingContinuation { c in
                      wait = c

                      connection.send(content: "\(cmd)\r".data(using: .ascii),
                                      completion: .contentProcessed { [weak self] error in
                          guard let error else { return }
                          Task { @MainActor in
                              guard let self, let w = self.wait else { return }
                              self.timeoutWork?.cancel()
                              self.timeoutWork = nil
                              self.wait = nil
                              w.resume(throwing: error)
                          }
                      })

                      let work = DispatchWorkItem { [weak self] in
                          Task { @MainActor in
                              guard let self, let w = self.wait else { return }
                              self.wait = nil
                              self.timeoutWork = nil
                              w.resume(throwing: E.timeout)
                          }
                      }

                      timeoutWork = work
                      DispatchQueue.main.asyncAfter(deadline: .now() + timeout, execute: work)
                  }
              }

              func initialize() async {
                  guard connection != nil else { add("Ð¡Ð½Ð°ÑÐ°Ð»Ð° Ð¿Ð¾Ð´ÐºÐ»ÑÑÐ¸ÑÑ Ðº ELM327."); return }
                  busy = true
                  defer { busy = false }

                  do {
                      for c in ["ATZ","ATE0","ATL0","ATS0","ATH1","ATSP0","ATCAF1"] {
                          let r = try await send(c, timeout: c == "ATZ" ? 8 : 5)
