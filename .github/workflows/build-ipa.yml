              @Published var busy = false

              private var connection: NWConnection?
              private var rx = Data()
              private var wait: CheckedContinuation<String, Error>?
              private var timeoutWork: DispatchWorkItem?

              func connect() {
                  guard let p = UInt16(port), let np = NWEndpoint.Port(rawValue: p) else {
                      status = "ÐÐµÐ²ÐµÑÐ½ÑÐ¹ Ð¿Ð¾ÑÑ"
                      return
                  }

                  disconnect()
                  status = "ÐÐ¾Ð´ÐºÐ»ÑÑÐµÐ½Ð¸Ðµâ¦"

                  let c = NWConnection(host: NWEndpoint.Host(host), port: np, using: .tcp)
                  connection = c

                  c.stateUpdateHandler = { [weak self] state in
                      Task { @MainActor in
                          guard let self else { return }
                          switch state {
                          case .ready:
                              self.status = "ÐÐ¾Ð´ÐºÐ»ÑÑÐµÐ½Ð¾"
                              self.add("TCP: \(self.host):\(self.port)")
                              self.receive()
                          case .failed(let e):
