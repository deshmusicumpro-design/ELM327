      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild             -project ELM327Reader.xcodeproj             -scheme ELM327Reader             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ELM327Reader.app Payload/
          zip -qry ELM327Reader-Recon-v0.2-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ELM327Reader-Recon-v0.2
          path: ELM327Reader-Recon-v0.2-unsigned.ipa
          if-no-files-found: error
