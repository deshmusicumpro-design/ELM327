                  }
              }

              func recon() async {
                  guard connection != nil else { add("Ð¡Ð½Ð°ÑÐ°Ð»Ð° Ð¿Ð¾Ð´ÐºÐ»ÑÑÐ¸ÑÑ Ðº ELM327."); return }

                  busy = true
                  progress = "ÐÐ¾Ð´Ð³Ð¾ÑÐ¾Ð²ÐºÐ°â¦"
                  results.removeAll()

                  defer {
                      busy = false
                      progress = "ÐÐ¾ÑÐ¾Ð²Ð¾"
                  }

                  do {
                      for c in ["ATZ","ATE0","ATL0","ATS0","ATH1","ATSP0","ATCAF1"] {
                          let r = try await send(c, timeout: c == "ATZ" ? 8 : 5)
                          add("â \(r)")
                      }

                      adapter = try await send("ATI"); add("â \(adapter)")
                      protocolName = try await send("ATDP"); add("â \(protocolName)")
                      voltage = try await send("ATRV"); add("â \(voltage)")

                      progress = "Ð¡ÑÐ°Ð½Ð´Ð°ÑÑÐ½ÑÐ¹ OBD-IIâ¦"
                      let s = try await send("0100"); add("â \(s)")
                      let v = try await send("0902", timeout: 7); add("â \(v)"); vin = parseVIN(v)

                      let headers =
                          (0x7E0...0x7E7).map { String(format: "%03X", $0) } +
                          (0x7A0...0x7AF).map { String(format: "%03X", $0) } +
