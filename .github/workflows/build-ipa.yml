            <dict/>
            <key>NSLocalNetworkUsageDescription</key>
            <string>ÐÐ¾ÑÑÑÐ¿ Ðº Ð»Ð¾ÐºÐ°Ð»ÑÐ½Ð¾Ð¹ ÑÐµÑÐ¸ Ð½ÑÐ¶ÐµÐ½ Ð´Ð»Ñ Ð¿Ð¾Ð´ÐºÐ»ÑÑÐµÐ½Ð¸Ñ Ðº Wi-Fi ELM327.</string>
