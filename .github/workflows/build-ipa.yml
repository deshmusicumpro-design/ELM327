              }

              func basics() async {
                  guard connection != nil else { add("Ð¡Ð½Ð°ÑÐ°Ð»Ð° Ð¿Ð¾Ð´ÐºÐ»ÑÑÐ¸ÑÑ Ðº ELM327."); return }
                  busy = true
                  defer { busy = false }

                  do {
                      let a = try await send("010C"); add("â \(a)"); rpm = parseRPM(a)
                      let b = try await send("010D"); add("â \(b)"); speed = parseSpeed(b)
                      let c = try await send("0105"); add("â \(c)"); coolant = parseTemp(c)
                      voltage = try await send("ATRV"); add("â \(voltage)")
                      let v = try await send("0902", timeout: 7); add("â \(v)"); vin = parseVIN(v)
                  } catch {
