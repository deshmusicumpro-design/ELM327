                      _ = try? await send("ATSH7DF")
                      add("RECON: Ð¾ÑÐ²ÐµÑÐ¸Ð²ÑÐ¸Ñ Ð·Ð°Ð¿ÑÐ¾ÑÐ¾Ð² \(results.count)")
                      add("RECON: ÐºÐ¾Ð¼Ð°Ð½Ð´Ñ Ð·Ð°Ð¿Ð¸ÑÐ¸, SecurityAccess, reset, programming Ð¸ clear DTC ÐÐ Ð¸ÑÐ¿Ð¾Ð»ÑÐ·Ð¾Ð²Ð°Ð»Ð¸ÑÑ.")
                  } catch {
