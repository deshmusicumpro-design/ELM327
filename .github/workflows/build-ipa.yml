                      var n = 0
                      let total = headers.count * queries.count

                      for h in headers {
                          let hr = try await send("ATSH\(h)")
                          add("â \(hr)")

                          for q in queries {
                              n += 1
                              progress = "\(n)/\(total) â¢ \(h) â¢ \(q)"

                              do {
