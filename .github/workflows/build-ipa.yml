                  }

                  a += ["", "RAW LOG:", log]
                  return a.joined(separator: "\n")
              }

              private func useful(_ s: String) -> Bool {
                  let u = s.uppercased()
                  if u.isEmpty || u.contains("NO DATA") || u.contains("STOPPED") ||
                     u.contains("UNABLE TO CONNECT") || u.contains("?") { return false }
                  if u.contains("7F2211") || u.contains("7F2212") || u.contains("7F2231") { return false }
                  return true
              }

              private func hex(_ s: String) -> String {
                  s.uppercased().filter { $0.isHexDigit }
              }

              private func parseRPM(_ s: String) -> String {
                  let h = hex(s)
                  guard let r = h.range(of: "410C") else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let p = r.upperBound
                  guard h.distance(from: p, to: h.endIndex) >= 4 else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let p2 = h.index(p, offsetBy: 2)
                  let p4 = h.index(p2, offsetBy: 2)
                  let A = Int(h[p..<p2], radix: 16) ?? 0
                  let B = Int(h[p2..<p4], radix: 16) ?? 0
                  return "\(((A * 256) + B) / 4) Ð¾Ð±/Ð¼Ð¸Ð½"
              }

              private func parseSpeed(_ s: String) -> String {
                  let h = hex(s)
                  guard let r = h.range(of: "410D") else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let p = r.upperBound
                  guard h.distance(from: p, to: h.endIndex) >= 2 else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let e = h.index(p, offsetBy: 2)
                  return "\(Int(h[p..<e], radix: 16) ?? 0) ÐºÐ¼/Ñ"
              }

              private func parseTemp(_ s: String) -> String {
                  let h = hex(s)
                  guard let r = h.range(of: "4105") else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let p = r.upperBound
                  guard h.distance(from: p, to: h.endIndex) >= 2 else { return "Ð½ÐµÑ Ð´Ð°Ð½Ð½ÑÑ" }
                  let e = h.index(p, offsetBy: 2)
                  return "\((Int(h[p..<e], radix: 16) ?? 0) - 40) Â°C"
              }

              private func parseVIN(_ s: String) -> String {
                  let parts = s
                      .replacingOccurrences(of: "\r", with: " ")
                      .replacingOccurrences(of: "\n", with: " ")
                      .split(separator: " ")
                      .map(String.init)

                  let bytes = parts.compactMap { token -> UInt8? in
                      guard token.count == 2 else { return nil }
                      return UInt8(token, radix: 16)
                  }

                  let text = String(bytes.compactMap { b -> Character? in
                      guard b >= 0x20 && b <= 0x7E else { return nil }
                      return Character(UnicodeScalar(b))
                  })

                  let clean = text.filter { $0.isLetter || $0.isNumber }
                  if clean.count >= 17 {
                      let e = clean.index(clean.startIndex, offsetBy: 17)
                      return String(clean[..<e])
                  }

                  return s.replacingOccurrences(of: "\n", with: " ")
              }

              private func add(_ s: String) {
                  if log.count > 45000 { log = String(log.suffix(30000)) }
                  log += (log.isEmpty ? "" : "\n") + s
              }
          }

