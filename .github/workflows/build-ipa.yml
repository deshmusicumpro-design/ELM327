          @MainActor
          final class OBDService: ObservableObject {
              struct ECUResult: Identifiable {
                  let id = UUID()
                  let header: String
                  let query: String
                  let response: String
              }

              enum E: Error { case notConnected, timeout, disconnected }

              @Published var host = "192.168.0.10"
              @Published var port = "35000"
              @Published var status = "ÐÑÐºÐ»ÑÑÐµÐ½Ð¾"
              @Published var adapter = "â"
              @Published var protocolName = "â"
              @Published var voltage = "â"
