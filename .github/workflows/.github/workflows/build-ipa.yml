name: Build ELM327 iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project folders
        run: |
          mkdir -p ELM327Reader

      - name: Create project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ELM327Reader

          options:
            bundleIdPrefix: ru.elm327reader

          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: 16.0

          targets:
            ELM327Reader:
              type: application
              platform: iOS

              sources:
                - ELM327Reader

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ru.elm327reader.app
                  PRODUCT_NAME: ELM327Reader
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: ELM327Reader/Info.plist
                  TARGETED_DEVICE_FAMILY: 1
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO

              scheme:
                testTargets: []
          EOF

      - name: Create Info.plist
        run: |
          cat > ELM327Reader/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>CFBundleDisplayName</key>
              <string>ELM327 Reader</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>0.1</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>UILaunchScreen</key>
              <dict/>

              <key>NSLocalNetworkUsageDescription</key>
              <string>
              Приложению нужен доступ к локальной сети
              для подключения к Wi-Fi адаптеру ELM327.
              </string>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

          </dict>
          </plist>
          EOF

      - name: Create Swift source
        run: |
          cat > ELM327Reader/ELM327ReaderApp.swift <<'EOF'
          import SwiftUI
          import Network

          @main
          struct ELM327ReaderApp: App {

              @StateObject
              private var obd = OBDService()

              var body: some Scene {

                  WindowGroup {

                      ContentView()
                          .environmentObject(obd)
                  }
              }
          }


          final class OBDService: ObservableObject {

              @Published var host = "192.168.0.10"
              @Published var port = "35000"

              @Published var status = "Отключено"
              @Published var adapter = "—"
              @Published var protocolName = "—"

              @Published var rpm = "—"
              @Published var speed = "—"
              @Published var temperature = "—"

              @Published var vin = "—"
              @Published var dtc = "—"

              @Published var log = ""

              private var connection: NWConnection?

              private var currentContinuation:
                  CheckedContinuation<String, Error>?

              private var buffer = Data()


              enum ELMError: Error {

                  case invalidPort
                  case notConnected
                  case disconnected
                  case timeout
              }


              func connect() {

                  guard
                      let p = UInt16(port),
                      let nwPort = NWEndpoint.Port(rawValue: p)
                  else {

                      status = "Неверный порт"
                      return
                  }

                  disconnect()

                  status = "Подключение..."

                  let connection = NWConnection(
                      host: NWEndpoint.Host(host),
                      port: nwPort,
                      using: .tcp
                  )

                  self.connection = connection

                  connection.stateUpdateHandler = {
                      [weak self] state in

                      DispatchQueue.main.async {

                          guard let self else {
                              return
                          }

                          switch state {

                          case .ready:

                              self.status = "Подключено"

                              self.addLog(
                                  "TCP соединение установлено"
                              )

                              self.receive()

                          case .failed(let error):

                              self.status =
                                  "Ошибка: \(error.localizedDescription)"

                          case .cancelled:

                              self.status = "Отключено"

                          default:

                              break
                          }
                      }
                  }

                  connection.start(
                      queue: DispatchQueue(
                          label: "elm327.network"
                      )
                  )
              }


              func disconnect() {

                  connection?.cancel()
                  connection = nil

                  status = "Отключено"
              }


              private func receive() {

                  guard let connection else {
                      return
                  }

                  connection.receive(
                      minimumIncompleteLength: 1,
                      maximumLength: 4096
                  ) {
                      [weak self]
                      data,
                      _,
                      complete,
                      error in

                      DispatchQueue.main.async {

                          guard let self else {
                              return
                          }

                          if let data {

                              self.buffer.append(data)

                              if
                                  let string =
                                      String(
                                          data: self.buffer,
                                          encoding: .ascii
                                      ),
                                  string.contains(">")
                              {

                                  self.buffer.removeAll()

                                  let clean =
                                      string
                                      .replacingOccurrences(
                                          of: ">",
                                          with: ""
                                      )
                                      .trimmingCharacters(
                                          in: .whitespacesAndNewlines
                                      )

                                  if let continuation =
                                      self.currentContinuation
                                  {

                                      self.currentContinuation = nil

                                      continuation.resume(
                                          returning: clean
                                      )
                                  }
                              }
                          }

                          if complete || error != nil {

                              if let continuation =
                                  self.currentContinuation
                              {

                                  self.currentContinuation = nil

                                  continuation.resume(
                                      throwing:
                                          ELMError.disconnected
                                  )
                              }
                          }
                          else {

                              self.receive()
                          }
                      }
                  }
              }


              func send(
                  _ command: String
              ) async throws -> String {

                  guard let connection else {
                      throw ELMError.notConnected
                  }

                  let cmd =
                      command
                      .trimmingCharacters(
                          in: .whitespacesAndNewlines
                      )
                      .uppercased()

                  addLog("→ \(cmd)")

                  let data =
                      "\(cmd)\r"
                      .data(using: .ascii)!

                  return try await
                      withCheckedThrowingContinuation {
                          continuation in

                          self.currentContinuation =
                              continuation

                          connection.send(
                              content: data,
                              completion:
                                  .contentProcessed {
                                      error in

                                      if let error {

                                          DispatchQueue.main.async {

                                              if let c =
                                                  self.currentContinuation
                                              {

                                                  self.currentContinuation =
                                                      nil

                                                  c.resume(
                                                      throwing: error
                                                  )
                                              }
                                          }
                                      }
                                  }
                          )

                          DispatchQueue.main.asyncAfter(
                              deadline: .now() + 6
                          ) {

                              if let c =
                                  self.currentContinuation
                              {

                                  self.currentContinuation = nil

                                  c.resume(
                                      throwing:
                                          ELMError.timeout
                                  )
                              }
                          }
                      }
              }


              func initialize() async {

                  let commands = [
                      "ATZ",
                      "ATE0",
                      "ATL0",
                      "ATS0",
                      "ATH0",
                      "ATSP0"
                  ]

                  do {

                      for command in commands {

                          let response =
                              try await send(command)

                          addLog("← \(response)")
                      }

                      adapter =
                          try await send("ATI")

                      addLog("← \(adapter)")

                      protocolName =
                          try await send("ATDP")

                      addLog("← \(protocolName)")
                  }
                  catch {

                      addLog(
                          "ERROR: \(error)"
                      )
                  }
              }


              func readLive() async {

                  do {

                      let rpmRaw =
                          try await send("010C")

                      addLog("← \(rpmRaw)")

                      rpm =
                          parseRPM(rpmRaw)

                      let speedRaw =
                          try await send("010D")

                      addLog("← \(speedRaw)")

                      speed =
                          parseSpeed(speedRaw)

                      let tempRaw =
                          try await send("0105")

                      addLog("← \(tempRaw)")

                      temperature =
                          parseTemperature(tempRaw)
                  }
                  catch {

                      addLog(
                          "ERROR: \(error)"
                      )
                  }
              }


              func readVIN() async {

                  do {

                      let value =
                          try await send("0902")

                      addLog("← \(value)")

                      vin = value
                  }
                  catch {

                      addLog(
                          "ERROR: \(error)"
                      )
                  }
              }


              func readDTC() async {

                  do {

                      let value =
                          try await send("03")

                      addLog("← \(value)")

                      dtc = value
                  }
                  catch {

                      addLog(
                          "ERROR: \(error)"
                      )
                  }
              }


              func terminal(
                  _ command: String
              ) async {

                  let cmd =
                      command
                      .uppercased()
                      .replacingOccurrences(
                          of: " ",
                          with: ""
                      )

                  guard allowed(cmd) else {

                      addLog(
                          "BLOCKED: \(cmd)"
                      )

                      return
                  }

                  do {

                      let response =
                          try await send(cmd)

                      addLog("← \(response)")
                  }
                  catch {

                      addLog(
                          "ERROR: \(error)"
                      )
                  }
              }


              private func allowed(
                  _ command: String
              ) -> Bool {

                  if command.hasPrefix("AT") {
                      return true
                  }

                  if command.hasPrefix("01") {
                      return true
                  }

                  if command == "03" {
                      return true
                  }

                  if command.hasPrefix("09") {
                      return true
                  }

                  if command.hasPrefix("22") {
                      return true
                  }

                  return false
              }


              private func cleanHex(
                  _ value: String
              ) -> String {

                  value
                      .uppercased()
                      .filter {
                          $0.isHexDigit
                      }
              }


              private func parseRPM(
                  _ value: String
              ) -> String {

                  let h = cleanHex(value)

                  guard
                      let range =
                          h.range(of: "410C")
                  else {

                      return "нет данных"
                  }

                  let start =
                      range.upperBound

                  guard
                      h.distance(
                          from: start,
                          to: h.endIndex
                      ) >= 4
                  else {

                      return "нет данных"
                  }

                  let aEnd =
                      h.index(
                          start,
                          offsetBy: 2
                      )

                  let bEnd =
                      h.index(
                          aEnd,
                          offsetBy: 2
                      )

                  let a =
                      Int(
                          h[start..<aEnd],
                          radix: 16
                      ) ?? 0

                  let b =
                      Int(
                          h[aEnd..<bEnd],
                          radix: 16
                      ) ?? 0

                  return
                      "\(((a * 256) + b) / 4) об/мин"
              }


              private func parseSpeed(
                  _ value: String
              ) -> String {

                  let h = cleanHex(value)

                  guard
                      let range =
                          h.range(of: "410D")
                  else {

                      return "нет данных"
                  }

                  let start =
                      range.upperBound

                  guard
                      h.distance(
                          from: start,
                          to: h.endIndex
                      ) >= 2
                  else {

                      return "нет данных"
                  }

                  let end =
                      h.index(
                          start,
                          offsetBy: 2
                      )

                  let speed =
                      Int(
                          h[start..<end],
                          radix: 16
                      ) ?? 0

                  return "\(speed) км/ч"
              }


              private func parseTemperature(
                  _ value: String
              ) -> String {

                  let h = cleanHex(value)

                  guard
                      let range =
                          h.range(of: "4105")
                  else {

                      return "нет данных"
                  }

                  let start =
                      range.upperBound

                  guard
                      h.distance(
                          from: start,
                          to: h.endIndex
                      ) >= 2
                  else {

                      return "нет данных"
                  }

                  let end =
                      h.index(
                          start,
                          offsetBy: 2
                      )

                  let a =
                      Int(
                          h[start..<end],
                          radix: 16
                      ) ?? 0

                  return "\(a - 40) °C"
              }


              private func addLog(
                  _ value: String
              ) {

                  DispatchQueue.main.async {

                      if self.log.isEmpty {

                          self.log = value
                      }
                      else {

                          self.log +=
                              "\n\(value)"
                      }
                  }
              }
          }


          struct ContentView: View {

              @EnvironmentObject
              var obd: OBDService

              @State
              private var command = ""


              var body: some View {

                  NavigationStack {

                      Form {

                          Section(
                              "Wi-Fi ELM327"
                          ) {

                              TextField(
                                  "IP",
                                  text: $obd.host
                              )

                              TextField(
                                  "Порт",
                                  text: $obd.port
                              )

                              Text(
                                  obd.status
                              )

                              Button(
                                  "Подключиться"
                              ) {

                                  obd.connect()
                              }

                              Button(
                                  "Отключиться"
                              ) {

                                  obd.disconnect()
                              }
                          }


                          Section(
                              "Адаптер"
                          ) {

                              LabeledContent(
                                  "ELM",
                                  value: obd.adapter
                              )

                              LabeledContent(
                                  "Протокол",
                                  value:
                                      obd.protocolName
                              )

                              Button(
                                  "Инициализировать"
                              ) {

                                  Task {

                                      await
                                          obd.initialize()
                                  }
                              }
                          }


                          Section(
                              "OBD-II"
                          ) {

                              LabeledContent(
                                  "Обороты",
                                  value: obd.rpm
                              )

                              LabeledContent(
                                  "Скорость",
                                  value: obd.speed
                              )

                              LabeledContent(
                                  "ОЖ",
                                  value:
                                      obd.temperature
                              )

                              Button(
                                  "Прочитать параметры"
                              ) {

                                  Task {

                                      await
                                          obd.readLive()
                                  }
                              }
                          }


                          Section(
                              "VIN"
                          ) {

                              Text(
                                  obd.vin
                              )
                              .textSelection(
                                  .enabled
                              )

                              Button(
                                  "Прочитать VIN"
                              ) {

                                  Task {

                                      await
                                          obd.readVIN()
                                  }
                              }
                          }


                          Section(
                              "DTC"
                          ) {

                              Text(
                                  obd.dtc
                              )
                              .textSelection(
                                  .enabled
                              )

                              Button(
                                  "Прочитать ошибки"
                              ) {

                                  Task {

                                      await
                                          obd.readDTC()
                                  }
                              }
                          }


                          Section(
                              "Read-only терминал"
                          ) {

                              TextField(
                                  "ATI / 0100 / 22F190",
                                  text: $command
                              )

                              Button(
                                  "Отправить"
                              ) {

                                  let value =
                                      command

                                  command = ""

                                  Task {

                                      await
                                          obd.terminal(
                                              value
                                          )
                                  }
                              }

                              Text(
                                  "Разрешены AT, 01, 03, 09 и UDS 22. Запись и программирование блокируются."
                              )
                              .font(
                                  .caption
                              )
                          }


                          Section(
                              "Лог"
                          ) {

                              Text(
                                  obd.log
                              )
                              .font(
                                  .system(
                                      size: 11,
                                      design:
                                          .monospaced
                                  )
                              )
                              .textSelection(
                                  .enabled
                              )
                          }
                      }
                      .navigationTitle(
                          "ELM327 Reader"
                      )
                  }
              }
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ELM327Reader.xcodeproj \
            -scheme ELM327Reader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/ELM327Reader.app \
            Payload/

          zip -qry \
            ELM327Reader-unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ELM327Reader-iOS
          path: ELM327Reader-unsigned.ipa
          if-no-files-found: error